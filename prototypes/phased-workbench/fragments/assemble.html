<section aria-label="Assemble phase" class="phase-view assemble-view" data-view="assemble">
<aside aria-label="Assembly Slides" class="fixed-rail assembly-slides">
<div class="rail-heading">
<div>
<p class="panel-label">Slides</p>
<h2>Roughs</h2>
</div>
</div>
<div class="assembly-slide-list" id="assembly-slide-list"></div>
</aside>
<section class="assembly-main">
<header class="assembly-toolbar">
<div aria-label="Assembly tools" class="tool-group" role="group">
<button data-tool="select" title="Select (V)" type="button">Select</button>
<button data-tool="hand" title="Hand (H)" type="button">Hand</button>
<button data-tool="crop" title="Crop (C)" type="button">Crop</button>
<button data-tool="gradient" title="Gradient (G)" type="button">Gradient</button>
</div>
<div aria-label="View controls" class="tool-group" role="group">
<button id="toggle-grid" type="button">Grid</button>
<button id="toggle-snap" type="button">Snap</button>
<button id="toggle-guides" type="button">Guides</button>
<button id="toggle-clean-preview" type="button">Clean Preview</button>
</div>
<div class="zoom-controls">
<button id="zoom-out" type="button">−</button>
<span id="zoom-label">36%</span>
<button id="zoom-in" type="button">+</button>
<button id="fit-artboard" type="button">Fit</button>
</div>
</header>
<div class="stage-viewport" id="stage-viewport">
<div class="stage-pan" id="stage-pan">
<article aria-label="Rough Slide assembly" class="artboard" id="artboard">
<div class="image-layer" id="image-layer"></div>
<svg aria-hidden="true" class="gradient-layer" id="gradient-layer" preserveaspectratio="none" viewbox="0 0 2576 1080"></svg>
<div class="text-stack" id="text-stack" tabindex="0">
<div class="text-role headline-role" id="text-headline"></div>
<div class="text-role subheadline-role" id="text-subheadline"></div>
<div class="text-role body-role" id="text-body"></div>
<button aria-label="Resize Text Stack" class="resize-handle" id="text-resize-handle" type="button"></button>
</div>
<svg aria-hidden="true" class="pitch-grid" id="pitch-grid" preserveaspectratio="none" viewbox="0 0 2576 1080"></svg>
<svg aria-hidden="true" class="interaction-overlay" id="interaction-overlay" preserveaspectratio="none" viewbox="0 0 2576 1080"></svg>
<div class="slide-annotations" id="slide-annotations"></div>
</article>
</div>
</div>
</section>
<aside aria-label="Assembly controls" class="fixed-context assembly-inspector">
<header>
<p class="panel-label">03 / Assemble</p>
<h2 id="assembly-title">Slide</h2>
<p id="assembly-purpose"></p>
</header>
<details open="">
<summary>Selection</summary>
<div class="inspector-section" id="selection-summary"></div>
</details>
<details open="">
<summary>Text</summary>
<div class="inspector-section">
<span class="field-label">Scale</span>
<div class="token-row" id="type-scale-tokens"></div>
<label>
<span>Body columns</span>
<select id="body-columns">
<option value="1">1 column</option>
<option value="2">2 columns</option>
<option value="3">3 columns</option>
</select>
</label>
<label>
<span>Column gap</span>
<input id="column-gap" max="140" min="24" step="2" type="range"/>
</label>
<button class="wide-button secondary" id="reset-text" type="button">Reset Text Stack</button>
</div>
</details>
<details open="">
<summary>Image</summary>
<div class="inspector-section">
<label>
<span>Source scale</span>
<input id="image-scale" max="2.4" min="1" step="0.01" type="range"/>
</label>
<div class="two-button-row">
<button id="centre-image" type="button">Centre</button>
<button id="reset-image" type="button">Reset</button>
</div>
<label>
<span>Source treatment</span>
<select id="source-treatment">
<option value="ready">Ready as supplied</option>
<option value="crop-provisional">Crop provisional</option>
<option value="needs-expansion">Needs expansion</option>
<option value="needs-retouch">Needs retouching</option>
<option value="needs-higher-resolution">Needs higher resolution</option>
<option value="placeholder">Placeholder only</option>
<option value="find-more">Find a stronger image</option>
</select>
</label>
<div class="two-button-row">
<button id="demote-primary-shortlist" type="button">Demote to shortlist</button>
<button id="demote-primary-alternate" type="button">Demote to alternate</button>
</div>
</div>
</details>
<details open="">
<summary>Gradient</summary>
<div class="inspector-section">
<div class="preset-grid" id="gradient-presets"></div>
<label>
<span>Feather</span>
<input id="gradient-feather" max="1" min="0" step="0.01" type="range"/>
</label>
<label>
<span>Opacity</span>
<input id="gradient-opacity" max="1" min="0" step="0.01" type="range"/>
</label>
<label class="switch-row">
<span>Gradient enabled</span>
<input id="gradient-enabled" type="checkbox"/>
</label>
</div>
</details>
<details open="">
<summary>Notes</summary>
<div class="inspector-section">
<label>
<span>Designer Notes</span>
<textarea id="designer-notes" placeholder="What must the final designer understand?" rows="5"></textarea>
</label>
<label>
<span>Find More Media</span>
<select id="find-more-state">
<option value="not-needed">Not needed</option>
<option value="needed">Needed</option>
<option value="resolved">Resolved</option>
<option value="waived">Waived</option>
</select>
</label>
<textarea id="find-more-brief" placeholder="Describe what is still missing." rows="4"></textarea>
</div>
</details>
</aside>
<footer aria-label="Assembly media tray" class="assembly-tray">
<section>
<div class="tray-heading"><strong>Selected slots</strong></div>
<div class="tray-items" id="assembly-primary-tray"></div>
</section>
<section>
<div class="tray-heading"><strong>Alternates</strong></div>
<div class="tray-items" id="assembly-alternate-tray"></div>
</section>
<section>
<div class="tray-heading"><strong>Slide shortlist</strong></div>
<div class="tray-items" id="assembly-shortlist-tray"></div>
</section>
<section>
<div class="tray-heading"><strong>Project Picks</strong></div>
<div class="tray-items" id="project-picks-tray"></div>
</section>
</footer>
</section>
