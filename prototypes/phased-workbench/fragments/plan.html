<section aria-label="Plan phase" class="phase-view plan-view" data-view="plan">
<aside aria-label="Parts" class="fixed-rail plan-parts">
<div class="rail-heading"><p class="panel-label">Parts</p><button class="text-button" id="show-all-parts" type="button">Show all</button></div>
<div class="parts-list" id="parts-list"></div>
<div class="rail-footer"><button class="wide-button" id="copy-conversion-prompt" type="button">Copy conversion prompt</button><button class="wide-button secondary" id="open-import" type="button">Paste Workbench Markdown</button></div>
</aside>
<section class="plan-main">
<header class="phase-heading"><div><p class="panel-label">01 / Plan</p><h2>What is every Slide doing?</h2><p>Verify exact copy. Name its purpose. Choose a starting visual logic.</p></div><div class="phase-summary" id="plan-summary"></div></header>
<div class="plan-toolbar">
<label><span>Find a Slide</span><input id="plan-search" placeholder="Title, purpose or copy" type="search"/></label>
<label><span>Status</span><select id="plan-status-filter"><option value="all">All Slides</option><option value="blocked">Needs Plan</option><option value="review">Review</option><option value="ready">Plan Ready</option><option value="skipped">Skipped</option></select></label>
</div>
<div class="deck-map" id="deck-map"></div>
</section>
</section>
