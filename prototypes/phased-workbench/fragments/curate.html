<section aria-label="Curate phase" class="phase-view curate-view" data-view="curate">
<aside aria-label="Slide media queue" class="fixed-rail slide-queue">
<div class="rail-heading"><div><p class="panel-label">Slides</p><h2>Media queue</h2></div><button class="text-button" id="next-media-issue" type="button">Next issue</button></div>
<div aria-label="Queue filter" class="queue-filters" role="group"><button class="is-active" data-queue-filter="all" type="button">All</button><button data-queue-filter="needs" type="button">Needs</button><button data-queue-filter="find-more" type="button">Find more</button><button data-queue-filter="ready" type="button">Ready</button></div>
<div class="curate-slide-list" id="curate-slide-list"></div>
</aside>
<section class="curate-main">
<header class="media-toolbar">
<label class="search-control"><span class="visually-hidden">Search media</span><input id="media-search" placeholder="Search filename, folder or note" type="search"/></label>
<label><span>Folder</span><select id="folder-filter"></select></label>
<label><span>Type</span><select id="type-filter"><option value="all">All types</option><option value="image">Images</option><option value="gif">GIF</option><option value="video">Video</option></select></label>
<label><span>View</span><select id="media-state-filter"><option value="all">All media</option><option value="project-picks">Project Picks</option><option value="slide-shortlist">Slide Shortlist</option><option value="selected">Selected</option><option value="alternates">Alternates</option><option value="unused">Unused</option></select></label>
<label class="density-control"><span>Density</span><input id="thumbnail-density" max="340" min="150" step="10" type="range"/></label>
<span class="media-count" id="media-count">0 assets</span>
</header>
<div aria-label="Project media wall" class="media-scroll" id="media-scroll" role="grid"><div class="media-canvas" id="media-canvas"></div></div>
</section>
<aside aria-label="Selected Slide brief" class="fixed-context slide-brief"><div id="slide-brief-content"></div></aside>
<footer aria-label="Selected Slide media tray" class="curate-tray">
<section><div class="tray-heading"><strong>Primary slots</strong><span id="slot-progress"></span></div><div class="tray-items" id="primary-tray"></div></section>
<section><div class="tray-heading"><strong>Alternates</strong></div><div class="tray-items" id="alternate-tray"></div></section>
<section class="shortlist-section"><div class="tray-heading"><strong>Slide shortlist</strong></div><div class="tray-items" id="shortlist-tray"></div></section>
</footer>
</section>
