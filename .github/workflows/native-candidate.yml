name: Native candidate
on:
  push:
    branches: [codex/native-workflow-fixes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 7
