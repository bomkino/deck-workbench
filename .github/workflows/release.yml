# Publishes one version, run by hand from the Actions tab on main for a
# vX.Y.Z tag: the exact successful CI artifact of the tag's commit (never
# rebuilt), its acceptance receipt, and the update feed installed copies read,
# signed with pitch.dog's update key (docs/UPDATES.md). Without an existing
# tag, the commit this run checked out from main is used, only if it carries
# that version; the tag is then created with the release.
#
# The release is published first without being Latest, so its files can be
# downloaded while installed copies still read the current Latest feed. A copy
# of the current Latest release then updates itself from the new release's own
# feed; only if that works is the new release made Latest. If it fails, the
# release stays published but not Latest and the run fails.
#
# The key is the SPARKLE_PRIVATE_KEY secret of the `release` environment,
# which only main may use. Only the signing step receives it; it is written to
# a file only the runner can read, used by Sparkle's generate_appcast and
# deleted. The GitHub token goes only to the steps that call GitHub, never to
# the signing step or the app under test. Scripts run from main's checkout,
# never from the tagged commit.
name: Publish tagged Mac release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (vX.Y.Z); created from main if missing
        required: true
        type: string
      rehearse:
        description: Rehearse (find, check and sign the artifact, but don't publish)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: workbench-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    environment: release
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # Nothing is pushed with git: the release creates its tag through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: On main only
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run this from main."; exit 1; }'
      - name: Use the tag, or main's commit for a new version
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then exit 0; fi
          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [ "$RELEASE_TAG" = "v$VERSION" ] || { echo "::error::There is no tag $RELEASE_TAG and main is at $VERSION. Raise the version on main, or tag the commit to release."; exit 1; }
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          echo "$RELEASE_TAG is main's $GITHUB_SHA; publishing creates the tag on GitHub."
      - name: Find and check the exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-native-release.sh stage "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - name: Sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::The release environment has no SPARKLE_PRIVATE_KEY secret. docs/UPDATES.md has the one-time command that sets it."; exit 1; }
          SPARKLE_BIN="$(scripts/fetch-sparkle.sh)/bin"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/update.key"
          SPARKLE_BIN="$SPARKLE_BIN" SPARKLE_KEY="$RUNNER_TEMP/update.key" \
            DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            scripts/sign-release.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/release/update-notes.md"
          rm -f "$RUNNER_TEMP/update.key"
      - name: Publish the release, not yet Latest
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-native-release.sh publish "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - name: Update a copy of the Latest release from the new release's feed
        if: ${{ !inputs.rehearse }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/test-live-update.sh "$RELEASE_TAG" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/appcast.xml"
      - name: Make the release Latest
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-native-release.sh promote "$RELEASE_TAG"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/update.key"
