name: Native Mac build
on:
  push:
    branches: [main, codex/native-workflow-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check document mutations and retained durability behavior
        run: npm test
      - name: Build exact native application
        run: scripts/build-native-macos.sh
      - name: Exercise the extracted Mac application and handoff
        run: scripts/verify-native-package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-mac-${{ steps.source.outputs.sha }}
          path: |
            artifacts/*.app.zip
            artifacts/*.sha256
            artifacts/evidence/native-acceptance.json
            artifacts/evidence/*.png
            artifacts/evidence/handoffs/**/*.pdf
            artifacts/evidence/handoffs/**/*.md
            artifacts/evidence/handoffs/**/*.csv
            artifacts/evidence/handoffs/**/Export issues.txt
          if-no-files-found: warn
          retention-days: 30
