name: Finish media focus handoff
on:
  push:
    branches: [codex/final-workflow-polish]
    paths: ['.github/workflows/finish-media-focus.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Apply exact focus correction without weakening event checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fd527dcb7564529b6ced5194c20615fcc7b4df0d
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='949a5d1e6c2d94a17b9019b502fc55284f88a1b8321bf7ab6f47b794b0b8784b'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git config user.name 'Chattie Intern'
          git config user.email 'hello@pitch.dog'
          git commit -m 'Synchronize search-to-grid focus and verify the ready native input window'
          git push origin HEAD:codex/final-workflow-polish
