name: Apply observed visual polish
on:
  push:
    branches: [codex/final-workflow-polish]
    paths: ['.visual-polish.patch', '.github/workflows/apply-visual-polish.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply the reviewed narrow-window and capture corrections
        run: |
          set -euo pipefail
          echo '421d625b454a2dbb4ac7a554bfa9f4302388cf29659e303a223e6fc3f3f15614  .visual-polish.patch' | sha256sum -c -
          git apply --check --index .visual-polish.patch
          git apply --index .visual-polish.patch
          rm .visual-polish.patch
          git config user.name 'Chattie Intern'
          git config user.email 'hello@pitch.dog'
          git add -A
          git commit -m 'Keep curation filters readable in narrow windows and distinguish full captures from partial ones'
          git push origin HEAD:codex/final-workflow-polish
