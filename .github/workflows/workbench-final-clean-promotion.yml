name: Workbench final clean promotion

on:
  push:
    branches:
      - codex/workbench-fix

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: workbench-final-clean-promotion
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.state.outputs.base_sha }}
      changed: ${{ steps.patch.outputs.changed }}
      patch: ${{ steps.patch.outputs.patch }}
      pr_state: ${{ steps.state.outputs.pr_state }}
      target_ref: ${{ steps.state.outputs.target_ref }}
      tree: ${{ steps.proposed.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: codex/workbench-fix

      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_state="$(gh pr view 2 --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          git fetch origin main
          case "$pr_state" in
            OPEN)
              target_ref='codex/workbench-fix'
              base_sha="$(git rev-parse HEAD)"
              ;;
            MERGED)
              target_ref='main'
              base_sha="$(git rev-parse origin/main)"
              ;;
            *)
              echo "PR #2 is $pr_state, not safely promotable" >&2
              exit 1
              ;;
          esac
          printf 'pr_state=%s\n' "$pr_state" >> "$GITHUB_OUTPUT"
          printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Recover or confirm the complete hardening tree
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/apply-workbench-fix-v7.py \
            scripts/apply-workbench-fix-v6.py \
            scripts/apply-workbench-fix-v4.py \
            scripts/apply-workbench-fix.py
          do
            if test -f "$script"; then
              python3 "$script"
              break
            fi
          done

          python3 <<'PY'
          from pathlib import Path
          import re

          for path in Path('.github/workflows').glob('*.y*ml'):
              source = path.read_text()
              if re.search(r'^name:\s*Source snapshot\s*$', source, flags=re.M):
                  path.unlink()
              elif re.search(r'^name:\s*Workbench fix ', source, flags=re.M):
                  path.unlink()
              elif re.search(r'^name:\s*Workbench promotion finalizer\s*$', source, flags=re.M):
                  path.unlink()
              elif re.search(r'^name:\s*Workbench final clean promotion\s*$', source, flags=re.M):
                  path.unlink()

          for path in Path('scripts').glob('apply-workbench-fix*.py'):
              path.unlink()
          PY

          test -f docs/evidence/WORKBENCH-FIX-2026-08-27.md
          test -f scripts/verify-repository.mjs
          test -f apps/linux/preferences.mjs
          grep -Fq 'Journal contains a blank record' packages/document-store/index.mjs
          grep -Fq 'Deck session requires reopen before further mutation' packages/document-store/index.mjs
          grep -Fq '#stoppedError' apps/linux/utility-client.mjs
          grep -Fq 'writeAtomically(destination, pdf)' apps/linux/main.mjs
          grep -Fq 'npm test && npm run verify:source && npm run verify:repository' package.json

          proof="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! grep -Fq "$proof" docs/evidence/WORKBENCH-FIX-2026-08-27.md; then
            printf '\n- Final clean promotion proof: `%s`\n' "$proof" >> docs/evidence/WORKBENCH-FIX-2026-08-27.md
          fi
          git add -A
          git diff --cached --check

      - id: proposed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tree="$(git write-tree)"
          proposed="$(printf '%s\n' 'verified clean Workbench promotion candidate' | git commit-tree "$tree" -p "$(git rev-parse HEAD)")"
          printf 'commit=%s\n' "$proposed" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          git diff --check "${{ steps.state.outputs.base_sha }}" "$proposed"
          git checkout --detach "$proposed"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run verify

      - id: patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary --full-index "${{ steps.state.outputs.base_sha }}" "${{ steps.proposed.outputs.commit }}" > /tmp/workbench-fix.patch
          if test -s /tmp/workbench-fix.patch; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            printf 'patch=' >> "$GITHUB_OUTPUT"
            gzip -9c /tmp/workbench-fix.patch | base64 -w0 >> "$GITHUB_OUTPUT"
            printf '\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\npatch=\n' >> "$GITHUB_OUTPUT"
          fi

  ubuntu-package:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.target_ref }}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.base_sha }}"
      - if: needs.prepare.outputs.changed == 'true'
        env:
          WORKBENCH_PATCH: ${{ needs.prepare.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WORKBENCH_PATCH" | base64 -d | gzip -d > /tmp/workbench-fix.patch
          git apply --index /tmp/workbench-fix.patch
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes file libasound2t64 libatspi2.0-0 libdrm2 libgbm1 libgtk-3-0 libnss3 libxss1 poppler-utils xdg-utils xvfb zstd
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run install:electron
      - run: scripts/linux/fetch-appimage-tools.sh
      - run: npm run verify
      - run: npm run build:linux
      - run: npm run verify:linux

  macos-package:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.target_ref }}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.base_sha }}"
      - if: needs.prepare.outputs.changed == 'true'
        env:
          WORKBENCH_PATCH: ${{ needs.prepare.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WORKBENCH_PATCH" | base64 -d | gzip -d > /tmp/workbench-fix.patch
          git apply --index /tmp/workbench-fix.patch
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'arm64'
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: scripts/build-macos.sh
      - run: scripts/verify-packaged-macos.sh
      - run: node scripts/write-evidence-receipt.mjs

  publish:
    needs:
      - prepare
      - ubuntu-package
      - macos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.target_ref }}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.base_sha }}"
      - if: needs.prepare.outputs.changed == 'true'
        env:
          WORKBENCH_PATCH: ${{ needs.prepare.outputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WORKBENCH_PATCH" | base64 -d | gzip -d > /tmp/workbench-fix.patch
          git apply --index /tmp/workbench-fix.patch
          test "$(git write-tree)" = "${{ needs.prepare.outputs.tree }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: |
          git diff --cached --check
          git diff --check
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden Workbench integrity and repository gates'
          fi
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.prepare.outputs.tree }}"
          printf 'head_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test "${{ needs.prepare.outputs.pr_state }}" = 'OPEN'; then
            git push origin HEAD:codex/workbench-fix
          else
            git push origin HEAD:main
          fi
      - if: needs.prepare.outputs.pr_state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$(gh pr view 2 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true'; then
            gh pr ready 2 --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge 2 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.commit.outputs.head_sha }}" \
            --subject 'fix: harden Workbench integrity and repository gates' \
            --body 'Strict journal records; durable/live-state fencing; dead utility-process handling; recoverable Linux preferences; atomic PDF publication; regression coverage; canonical repository verification; Ubuntu and native macOS package proof; documentation and branch cleanup.'
      - if: needs.prepare.outputs.pr_state == 'MERGED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/codex/workbench-fix" || true
      - name: Prove canonical main and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main^{tree})" = "${{ needs.prepare.outputs.tree }}"
          git checkout --detach origin/main
          test "$(gh pr view 2 --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = 'MERGED'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/workbench-fix" >/dev/null 2>&1; then
            echo 'obsolete branch still exists' >&2
            exit 1
          fi
          npm ci --ignore-scripts
          npm run verify
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run dw-g01-linux.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          gh workflow run dw-t00-macos.yml --repo "$GITHUB_REPOSITORY" --ref main || true
