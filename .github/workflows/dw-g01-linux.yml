name: DW-G01 Ubuntu Linux x64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dw-g01-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-seams:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  packaged-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux journey dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes file libasound2t64 libatspi2.0-0 libdrm2 libgbm1 libgtk-3-0 libnss3 libxss1 poppler-utils xdg-utils xvfb zstd
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run install:electron
      - run: scripts/linux/fetch-appimage-tools.sh
      - run: npm run verify
      - run: npm run build:linux
      - run: npm run verify:linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deck-workbench-dw-g01-ubuntu-x64-${{ env.EXPECTED_SHA }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.pkg.tar.zst
            artifacts/*.pkg.tar.zst.sha256
            artifacts/*.AppImage
            artifacts/*.AppImage.sha256
            artifacts/evidence/linux/*
            artifacts/evidence/linux/journey/*
          if-no-files-found: error
