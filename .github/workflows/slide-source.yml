name: Slide editing source
on:
  push:
    branches: [codex/slide-editing]
    paths: [.github/workflows/slide-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: git archive HEAD -o source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slide-editing-source
          path: source.tar
          retention-days: 3
