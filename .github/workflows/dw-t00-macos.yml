name: DW-T00 macOS arm64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dw-t00-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-seams:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm run verify

  packaged-apple-silicon:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Prove native runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
      - run: npm run verify
      - run: scripts/build-macos.sh
      - run: scripts/verify-packaged-macos.sh
      - run: node scripts/write-evidence-receipt.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deck-workbench-dw-t00-${{ env.EXPECTED_SHA }}
          path: |
            artifacts/*.app.zip
            artifacts/*.sha256
            artifacts/evidence/*
          if-no-files-found: error
