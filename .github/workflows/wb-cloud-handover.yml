name: WB Cloud Work Handover

on:
  push:
    branches:
      - codex/workbench-phased-rebuild
    paths:
      - CLOUD_WORK_HANDOVER_2026-08-29.md
      - .github/workflows/wb-cloud-handover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-cloud-handover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build exact source handover
        shell: bash
        run: |
          set -euo pipefail
          package_parent="handover/staging"
          package_name="deck-workbench-cloud-work-handover"
          package_root="$package_parent/$package_name"
          output_root="handover/output"
          zip_name="Deck-Workbench-Cloud-Work-Handover-${GITHUB_SHA}.zip"

          rm -rf handover
          mkdir -p "$package_root" "$output_root"

          git archive --format=tar HEAD | tar -xf - -C "$package_root"

          sed -i "s/__PACKAGED_COMMIT__/${GITHUB_SHA}/g" "$package_root/CLOUD_WORK_HANDOVER_2026-08-29.md"

          cat > "$package_root/EXACT_STATE.txt" <<EOF
          Repository: bomkino/deck-workbench
          Branch: codex/workbench-phased-rebuild
          Commit: ${GITHUB_SHA}
          Base branch: main
          Pull request: #6
          Workflow run: ${GITHUB_RUN_ID}
          Packaged at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Source form: complete tracked repository archive; symlinks preserved; .git, node_modules, build outputs and prior runtime packages excluded
          EOF

          (
            cd "$package_root"
            find . -type l -printf '%P -> %l\n' | sort > HANDOVER_SYMLINKS.txt
            find . -type f ! -name HANDOVER_SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > HANDOVER_SHA256SUMS.txt
          )

          test -s "$package_root/CLOUD_WORK_HANDOVER_2026-08-29.md"
          test -s "$package_root/EXACT_STATE.txt"
          test -s "$package_root/HANDOVER_SHA256SUMS.txt"
          test -f "$package_root/package.json"
          test -f "$package_root/packages/workspace/app/index.html"
          test -f "$package_root/docs/product/PHASED_WORKBENCH_CONSTITUTION.md"
          test -L "$package_root/apps/macos/Resources/Workspace"
          test "$(readlink "$package_root/apps/macos/Resources/Workspace")" = '../../../build/generated/workspace'

          (
            cd "$package_parent"
            zip -qry -y "$OLDPWD/$output_root/$zip_name" "$package_name"
          )

          cp "$package_root/CLOUD_WORK_HANDOVER_2026-08-29.md" "$output_root/"
          sha256sum "$output_root/$zip_name" > "$output_root/$zip_name.sha256"

          verify_root="$(mktemp -d)"
          trap 'rm -rf "$verify_root"' EXIT
          unzip -q "$output_root/$zip_name" -d "$verify_root"
          verify_package="$verify_root/$package_name"
          test -L "$verify_package/apps/macos/Resources/Workspace"
          test "$(readlink "$verify_package/apps/macos/Resources/Workspace")" = '../../../build/generated/workspace'
          (
            cd "$verify_package"
            sha256sum -c HANDOVER_SHA256SUMS.txt
          )
          ! grep -R '__PACKAGED_COMMIT__' "$verify_package/CLOUD_WORK_HANDOVER_2026-08-29.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deck-workbench-cloud-work-handover-${{ github.sha }}
          path: handover/output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
